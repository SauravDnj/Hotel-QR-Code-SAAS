<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · Hotel Staff</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
             background: #f7f7f5; color: #1c2331; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #0f131b; color: #e8eaee; } .card { background: #171c27; } }
      .card { max-width: 360px; background: #fff; border-radius: 16px; padding: 28px; text-align: center;
              box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      button { margin-top: 16px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
               background: #1f2a44; color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="font-size: 20px; margin: 0 0 8px">You're offline</h1>
      <p style="margin: 0; opacity: .75">Guest requests are safe on the server. Reconnect and the inbox will catch up automatically.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
